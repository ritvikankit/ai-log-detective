
spring.application.name=ai-log-detective
server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# FreeLLMAPI is OpenAI-compatible. These values come only from the environment.
freellm.base-url=${FREELLM_BASE_URL:}
freellm.model=${FREELLM_MODEL:}
freellm.api-key=${FREELLM_API_KEY:}
freellm.connect-timeout=5s
freellm.read-timeout=60s

